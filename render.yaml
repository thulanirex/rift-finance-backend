services:
  - type: web
    name: rift-finance-hub-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        sync: false
      - key: ANCHOR_PROGRAM_ID
        sync: false
